#
# Deploys the web build to Cloudflare Pages after CI passes on `dist`.
# Same build steps as scripts/deploy-web.sh, followed by a wrangler
# direct upload to the `halo-dev-ham2k-net` Pages project.
#
# The workflow_run trigger only fires for the repository's default branch,
# which is `dist` here — the branches filter is just an extra guard. A CI
# failure skips the deploy silently; check the Actions tab.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id

name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dist]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Deploy the exact commit CI validated (falls back to the branch head
      # for manual workflow_dispatch runs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - name: Build TypeScript extensions
        run: |
          cd extensions
          npm ci
          npm run build

      # lib/config/mapbox_token.dart is gitignored; the blank template is a
      # supported configuration (the Map tab falls back to OpenStreetMap, and
      # the web build never uses Mapbox). Same fallback as scripts/test.sh.
      - name: Use blank Mapbox token template
        run: cp app/lib/config/mapbox_token.dart.example app/lib/config/mapbox_token.dart

      - name: Build Flutter web app
        run: |
          cd app
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      # --branch=main marks the deployment as production: direct-upload Pages
      # projects use "main" as their production branch by default.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy app/build/web --project-name=halo-dev-ham2k-net --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
