#
# Deploys the web build to Cloudflare Pages after CI passes on `dist`.
# Same build steps as scripts/deploy-web.sh, followed by a wrangler
# direct upload to the `halo-dev-ham2k-net` Pages project.
#
# The workflow_run trigger only fires for the repository's default branch,
# which is `dist` here — the branches filter is just an extra guard. A CI
# failure skips the deploy silently; check the Actions tab.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id

name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dist]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Edition-scoped secrets live in GitHub Environments named after the
    # editions (the GitHub analog of Codemagic's shared_halo_* groups):
    # HALO_SENTRY_DSN here resolves to the `dev` environment's value, since
    # halo-dev.ham2k.net builds are the Dev edition (#76). A future Next/
    # Regular web deploy job would declare its own edition's environment.
    environment: dev
    steps:
      # Deploy the exact commit CI validated (falls back to the branch head
      # for manual workflow_dispatch runs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - name: Build TypeScript extensions
        run: |
          cd extensions
          npm ci
          npm run build

      # lib/config/mapbox_token.dart is gitignored; the blank template is a
      # supported configuration (the Map tab falls back to OpenStreetMap, and
      # the web build never uses Mapbox). Same fallback as scripts/test.sh.
      - name: Use blank Mapbox token template
        run: cp app/lib/config/mapbox_token.dart.example app/lib/config/mapbox_token.dart

      # HALO_SENTRY_DSN (optional secret): error reporting (#76). The
      # dart-define feeds the Flutter app's ErrorReportingService; the sed
      # fills the index.html boot-failure reporter's placeholder (the app
      # can't report a failure to start — it never ran). Both no-op when the
      # secret is unset: empty define = disabled, placeholder left = disabled.
      - name: Build Flutter web app
        run: |
          cd app
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=HALO_SENTRY_DSN="${HALO_SENTRY_DSN}"
        env:
          HALO_SENTRY_DSN: ${{ secrets.HALO_SENTRY_DSN }}

      # perl, not sed: the replacement interpolates the env var literally, so
      # a secret containing sed metacharacters (&, |, \) can't silently
      # corrupt the deployed page.
      - name: Inject Sentry DSN into the boot-failure reporter
        if: ${{ secrets.HALO_SENTRY_DSN != '' }}
        run: |
          perl -pi -e 's/%%HALO_SENTRY_DSN%%/$ENV{HALO_SENTRY_DSN}/g; s/%%HALO_WEB_ENVIRONMENT%%/halo-dev/g' app/build/web/index.html
        env:
          HALO_SENTRY_DSN: ${{ secrets.HALO_SENTRY_DSN }}

      # --branch=dist marks the deployment as production: the Pages project's
      # production branch is set to "dist" (changed from the direct-upload
      # default of "main" on 2026-07-22; deploys with any other branch name
      # land in the Preview environment and never reach halo-dev.ham2k.net).
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy app/build/web --project-name=halo-dev-ham2k-net --branch=dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
