#
# Deploys the web build to Cloudflare Pages after CI passes on `main`.
# Same build steps as scripts/deploy-web.sh, followed by a wrangler
# direct upload to the `halo-dev-ham2k-net` Pages project.
#
# The workflow_run trigger only fires for the repository's default branch,
# which is `main` here — the branches filter is just an extra guard. A CI
# failure skips the deploy silently; check the Actions tab.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id
# and optionally MAPBOX_ACCESS_TOKEN (a publishable pk. token); when unset,
# the build falls back to OSM maps.

name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Edition-scoped secrets live in GitHub Environments named after the
    # editions (the GitHub analog of Codemagic's shared_halo_* groups):
    # HALO_SENTRY_DSN here resolves to the `dev` environment's value, since
    # halo-dev.ham2k.net builds are the Dev edition (#76). A future Next/
    # Regular web deploy job would declare its own edition's environment.
    environment: dev
    steps:
      # Deploy the exact commit CI validated (falls back to the branch head
      # for manual workflow_dispatch runs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - name: Build TypeScript extensions
        run: |
          cd extensions
          npm ci
          npm run build

      # lib/config/secrets.dart is gitignored, so a fresh checkout doesn't have
      # it and the build fails to compile. Generate it from the environment via
      # the same helper every Codemagic build uses (names come from
      # secrets.dart.example) — MAPBOX_ACCESS_TOKEN is the only one this deploy
      # provides; it's a public pk. token, safe to bake into the served JS.
      # Blank values (including a missing MAPBOX_ACCESS_TOKEN repository
      # secret) degrade rather than fail — the Map tab falls back to
      # OpenStreetMap. The helper lives in app_dist/, absent from public
      # checkouts, which get the blank template instead — same handling as
      # scripts/test.sh:54-61.
      - name: Generate build secrets
        run: |
          if [ -f app_dist/ci/secrets-common.sh ]; then
            . app_dist/ci/secrets-common.sh
            generate_secrets
          else
            echo "no app_dist (public checkout), using the blank template"
            cp app/lib/config/secrets.dart.example app/lib/config/secrets.dart
          fi
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

      # HALO_SENTRY_DSN (optional secret): error reporting (#76). The
      # dart-define feeds --target=../app_dist/lib/main_dist.dart, which
      # constructs the real SentryErrorReportingBackend (Sentry-specific
      # code lives entirely in app_dist, same as every other platform's
      # build script); the sed below fills the index.html boot-failure
      # reporter's placeholder separately (the app can't report a failure to
      # start — it never ran). Both no-op when the secret is unset: empty
      # define = disabled, placeholder left = disabled.
      # HALO_GIT_SHA: the short SHA of the deployed commit, shown in the home
      # and About version displays (version_label.dart's kGitSha) so we can tell
      # exactly which commit halo-dev is serving. This job sets no HALO_EDITION,
      # so the deploy is the Dev edition and the SHA is the ONLY build identity
      # it shows — kBuildNumber names the last release, not this deploy. HEAD is
      # the ref checked out above (workflow_run.head_sha), matching
      # build-macos.sh's convention.
      - name: Build Flutter web app
        run: |
          cd app
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=HALO_SENTRY_DSN="${HALO_SENTRY_DSN}" \
            --dart-define=HALO_GIT_SHA="$(git rev-parse --short HEAD)" \
            --target=../app_dist/lib/main_dist.dart
        env:
          HALO_SENTRY_DSN: ${{ secrets.HALO_SENTRY_DSN }}

      # BuildFreshnessService's deploy-stamp: the same sha baked into
      # kGitSha above, but fetched at runtime (cache-busted per request) so a
      # tab left open can tell it's stale even though Cloudflare's default
      # caching keeps flutter_service_worker.js around for hours — the
      # dashboard showing a fresh deploy doesn't mean an open tab has it.
      - name: Stamp the deployed commit for BuildFreshnessService
        run: git rev-parse --short HEAD > app/build/web/build_sha.txt

      # perl, not sed: the replacement interpolates the env var literally, so
      # a secret containing sed metacharacters (&, |, \) can't silently
      # corrupt the deployed page.
      # Guarded in shell, NOT with a step-level `if`: the secrets context is
      # not allowed in `if` expressions, and referencing it there invalidates
      # the entire workflow file (every run fails in 0s with "workflow file
      # issue"). Reading it into `env:` is fine.
      - name: Inject Sentry DSN into the boot-failure reporter
        run: |
          if [ -n "${HALO_SENTRY_DSN}" ]; then
            perl -pi -e 's/%%HALO_SENTRY_DSN%%/$ENV{HALO_SENTRY_DSN}/g; s/%%HALO_WEB_ENVIRONMENT%%/halo-dev/g' app/build/web/index.html
            echo "DSN injected into the boot-failure reporter"
          else
            echo "HALO_SENTRY_DSN not set — placeholder left, reporter disabled"
          fi
        env:
          HALO_SENTRY_DSN: ${{ secrets.HALO_SENTRY_DSN }}

      # --branch=main marks the deployment as production: it must match the
      # Pages project's PRODUCTION BRANCH SETTING (also "main"). Deploys with
      # any other branch label land in the Preview environment and never
      # reach halo-dev.ham2k.net. Change this flag and the Pages project
      # setting TOGETHER or production deploys silently stop.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy app/build/web --project-name=halo-dev-ham2k-net --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
