#
# Deploys a preview build of the web app to Cloudflare Pages when a commit
# is tagged `web-preview-<name>`. The preview lands on the same
# `halo-dev-ham2k-net` Pages project as a non-production deployment, served at
#   https://<name>-halo-dev.ham2k.net
# (via the workers/halo-dev-preview-proxy Worker; the underlying Pages alias
# https://<name>.halo-dev-ham2k-net.pages.dev also works). Re-pushing a tag
# with the same name replaces that preview.
#
#   git tag web-preview-my-feature && git push halo-dist web-preview-my-feature
#
# Tag pushes run the workflow file from the tagged commit, so tags only
# trigger on commits that already contain this file (branches based on main
# after it landed). For older commits, use the manual run (workflow_dispatch)
# from the Actions tab, which takes any ref plus a preview name.
#
# Requires the same repository secrets as deploy-web.yml —
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# — with the token also granting Zone Read + DNS Edit on ham2k.net for the
# preview DNS records.

name: Deploy Web Preview

on:
  push:
    tags: ['web-preview-*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
      name:
        description: Preview name (becomes <name>.halo-dev-ham2k-net.pages.dev)
        required: true

concurrency:
  group: deploy-web-preview-${{ github.event.inputs.name || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Cloudflare branch aliases are lowercase alphanumerics and hyphens,
      # truncated to 28 characters — sanitize the name to match so the URL
      # we print is the one Cloudflare actually serves.
      - name: Resolve preview name
        run: |
          RAW="${{ github.event.inputs.name || github.ref_name }}"
          NAME="${RAW#web-preview-}"
          NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/^-*//' -e 's/-*$//' | cut -c1-28)
          if [[ -z "$NAME" || "$NAME" == "dist" || "$NAME" == "main" ]]; then
            echo "Invalid preview name '$RAW'" >&2
            exit 1
          fi
          echo "PREVIEW_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - name: Build TypeScript extensions
        run: |
          cd extensions
          npm ci
          npm run build

      # lib/config/secrets.dart is gitignored, so a fresh checkout doesn't have
      # it and the build fails to compile. Generate it from the environment —
      # previews currently get no secrets; blank values degrade rather than
      # fail. Same handling as deploy-web.yml.
      - name: Generate build secrets
        run: |
          if [ -f app_dist/ci/secrets-common.sh ]; then
            . app_dist/ci/secrets-common.sh
            generate_secrets
          else
            echo "no app_dist (public checkout), using the blank template"
            cp app/lib/config/secrets.dart.example app/lib/config/secrets.dart
          fi

      # HALO_GIT_SHA: short SHA of the built ref, shown in the home and About
      # version displays (version_label.dart's kGitSha) so a preview identifies
      # the exact commit it was built from — and, this being a Dev-edition
      # build, it is the only build identity shown. Matches deploy-web.yml.
      - name: Build Flutter web app
        run: |
          (cd packages/halo_build_tools && dart run bin/prepare_record.dart)
          cd app
          sha=$(git rev-parse --short HEAD) || { echo "::error::cannot read the commit being built"; exit 1; }
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --dart-define=HALO_GIT_SHA="$sha"

      # Any --branch other than "main" (the project's production branch)
      # creates a preview deployment aliased to that name.
      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler@4 pages deploy app/build/web --project-name=halo-dev-ham2k-net --branch="$PREVIEW_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # <name>-halo-dev.ham2k.net is served by the halo-dev-preview-proxy
      # Worker (workers/halo-dev-preview-proxy), routed on
      # *-halo-dev.ham2k.net/*. Worker routes only receive traffic for
      # hostnames with a proxied DNS record, so upsert a placeholder AAAA
      # (100:: is the standard discard address for Worker-routed hostnames).
      # Needs Zone Read + DNS Edit on ham2k.net in CLOUDFLARE_API_TOKEN.
      - name: Create preview DNS record
        run: |
          api() { curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONE_ID=$(api "https://api.cloudflare.com/client/v4/zones?name=ham2k.net" | jq -r '.result[0].id')
          HOST="${PREVIEW_NAME}-halo-dev.ham2k.net"
          EXISTING=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=AAAA&name=$HOST" | jq -r '.result[0].id // empty')
          if [[ -z "$EXISTING" ]]; then
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              --data "{\"type\":\"AAAA\",\"name\":\"$HOST\",\"content\":\"100::\",\"proxied\":true,\"ttl\":1,\"comment\":\"HaLo web preview (deploy-web-preview.yml)\"}" > /dev/null
            echo "Created DNS record for $HOST"
          else
            echo "DNS record for $HOST already exists"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Report preview URL
        run: echo "### Preview deployed to https://${PREVIEW_NAME}-halo-dev.ham2k.net" >> "$GITHUB_STEP_SUMMARY"
