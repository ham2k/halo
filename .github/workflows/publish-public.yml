#
# Regenerates the publishable history on every push to `main`: filters the
# private paths out of the FULL history with git-filter-repo and force-pushes
# the result to the `public` branch here.
#
# WHICH paths, and the guards over the result, live in
# `app_dist/ci/publish-filter.sh` — not here. This file is itself published,
# so a path list in it would name in public the very directories it exists to
# hide. Change the list there.
#
# Publishing to the open-source MIRROR (ham2k/halo) is deliberately NOT part
# of this workflow — `halo-ops publish-code` does that, on demand, so work can sit
# on `main` for a few days before going public. (It also sidesteps GitHub's
# `workflow`-scope restriction: the filtered history carries workflow files,
# which no PAT or API-created deploy key here can push — the operator's own
# SSH key can.)
#
# The filter is deterministic — same input history, same output SHAs — so
# each run reproduces the previously published commits byte-for-byte and
# appends the new ones; the force-push is effectively a fast-forward unless
# `main` itself was rewritten. Commits that ONLY touched app_dist prune to
# nothing and vanish from the public history.
#
# Consequences to keep in mind:
#   - COMMIT MESSAGES are published verbatim. Never describe app_dist
#     contents in one (see AGENTS.md).
#   - `public` is a generated artifact. Never push to it by hand; the next
#     run overwrites it.
#   - Adding a path to the filter that ALREADY has published history rewrites
#     every published SHA. A path that never existed publicly leaves the
#     previously published commits byte-for-byte identical.

name: Publish Public

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-public
  cancel-in-progress: true

jobs:
  publish:
    # The workflow file itself is published; this keeps it inert if it ever
    # runs anywhere but the private repo.
    if: github.repository == 'ham2k/halo-dist'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      # Clones, filters and guards in one step — see the script for what it
      # removes and what it refuses to publish.
      - name: Filter private paths out of the full history
        run: source/app_dist/ci/publish-filter.sh source filtered

      - name: Push the public branch (this repo)
        run: |
          cd filtered
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/ham2k/halo-dist.git" \
            main:refs/heads/public
