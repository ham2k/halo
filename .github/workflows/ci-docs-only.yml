#
# Shim for docs-only pull requests (GitHub's documented "skipped but
# required checks" pattern): ci.yml ignores these paths, so a docs-only PR
# would otherwise produce NO `quick` check run — and if `quick` is ever made
# a required check, such PRs would block forever on "expected". This
# workflow carries the SAME workflow name (CI) and job name (quick), is
# triggered ONLY by the paths ci.yml ignores, and succeeds instantly.
#
# Keep the `paths` list here the exact mirror of `paths-ignore` in ci.yml.
# Known limitation of the pattern: a PR touching both docs and code runs
# both workflows; both `quick` check runs report on the PR.
#
# pull_request only, deliberately: a push-triggered shim named "CI" would
# complete on `dist` and spuriously trigger the web deploy
# (deploy-web.yml's workflow_run gate matches the workflow name).

name: CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only change
        run: echo "Docs-only change — code checks not required."
