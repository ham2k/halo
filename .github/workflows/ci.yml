#
# Runs the same checks as `mise run test` locally (scripts/test.sh), but
# split across parallel jobs instead of one sequential run:
#   - extensions: typecheck + unit-test the TS extensions, then build the
#     bundles and upload them as an artifact.
#   - dart (matrix): analyze + test the small/independent Dart packages.
#   - app-test (matrix): app is the slowest package by far (~45% of the old
#     single-job runtime), so its `flutter test` run is sharded across
#     several runners on top of the job split.
# Every job that touches app/ downloads the extension bundles into
# app/assets/extensions first because app/pubspec.yaml declares that as a
# required asset directory (fresh checkouts don't have it, it's gitignored)
# and app's own tests load real bundle content through it.
#
# Two tiers: pushes to the long-lived branches run the full parallel suite
# below; pull requests run ONLY the single `quick` job (typecheck + analyze
# via scripts/test.sh --quick — tests are run locally before opening a PR,
# and the full suite runs on the target branch right after the merge, where
# a failure on `dist` blocks the web deploy via deploy-web.yml). One
# sequential job instead of a matrix keeps the billed runner minutes down:
# every extra job pays its own setup and rounds up to a whole minute.
#
# ONE exception, on the `extensions` gate below: a PR that touches
# .github/workflows/** or scripts/** is changing the machinery that runs the
# tests, so `quick` passing says nothing about whether the suite still runs.
# #411 deleted a file three workflow steps still copied; app-test was red on
# every push to `dist` for four merges (and the web deploy, which fires on CI
# succeeding, stopped with it) because no PR had ever exercised that job.
name: CI

# Docs-only changes skip this workflow entirely (zero billed minutes). The
# ignore list must stay the exact mirror of the `paths` list in
# ci-docs-only.yml — that shim reports an instant `quick` success for
# docs-only PRs so a future required-check rule can't block on a skipped
# workflow. Note: on `dist`, a docs-only push therefore runs no CI, which
# also means no web deploy (deploy-web.yml fires on CI completing) — the
# previous deployment simply stays live.
on:
  push:
    branches: [main, main-public, main-dist-private, dist]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'

jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Stated explicitly, not left to the repository default: the step below
    # reads the PR's file list from the API, and `bash -e` would fail this job
    # on EVERY pull request if the default token happened to lack that scope.
    permissions:
      contents: read
      pull-requests: read
    # Read by the `extensions` gate to decide whether this PR also needs the
    # full suite. Computed as a step here rather than in a job of its own
    # precisely to hold the line on billed minutes: `quick` already runs on
    # every PR, so this costs nothing, where a separate job would round up to a
    # whole extra minute on every PR forever.
    outputs:
      touches_ci: ${{ steps.touches_ci.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      # First, and needing no toolchain: the answer is still recorded when the
      # checks below fail, which keeps the gate's own logic readable.
      #
      # Asks the API for the PR's file list rather than diffing against the base
      # — the checkout above is shallow and has no base commit to diff against,
      # and `fetch-depth: 0` would slow down every PR to serve the rare one.
      - name: Does this PR touch CI or the build scripts?
        id: touches_ci
        run: |
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if grep -qE '^(\.github/workflows/|scripts/)' <<<"$files"; then
            echo 'result=true' >> "$GITHUB_OUTPUT"
            echo 'touches CI or the build scripts — the full suite will run too'
          else
            echo 'result=false' >> "$GITHUB_OUTPUT"
            echo 'no CI or build-script changes — quick only'
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - name: Basic checks (typecheck + analyze, no tests)
        run: ./scripts/test.sh --quick

  # This is the single gate for the whole heavy suite: `dart` and `app-test`
  # declare `needs: extensions` and no `if:` of their own, so skipping this job
  # skips both of them with it.
  #
  # `always()` is what lets a push through at all — `quick` is
  # pull_request-only, and a skipped dependency would otherwise skip this job
  # too. On the PR path `quick` must also have SUCCEEDED: a CI-touching PR then
  # runs the suite after it rather than alongside (a few minutes more wall
  # clock, on a rare PR), which beats spending nine jobs on a branch that
  # doesn't even analyze.
  extensions:
    needs: quick
    if: >-
      always() && (github.event_name == 'push' ||
      (needs.quick.result == 'success' && needs.quick.outputs.touches_ci == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      - name: Install, typecheck, unit test
        run: |
          cd extensions
          npm ci
          npm run typecheck
          npm test

      - name: Build bundles
        run: |
          cd extensions
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: extension-bundles
          path: app/assets/extensions
          retention-days: 1

  dart:
    needs: extensions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/halo_core
          - packages/halo_build_tools
          - packages/halo_extension_host
          - packages/halo_quickjs
          - packages/halo_widgets
    steps:
      - uses: actions/checkout@v4

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - uses: actions/download-artifact@v4
        with:
          name: extension-bundles
          path: app/assets/extensions

      # halo_quickjs compiles quickjs-ng into its own plugin library, but
      # `flutter test` runs in the host VM and never performs a platform native
      # build — so there is nothing for the bindings to open unless a host copy
      # is built first. Needed by BOTH the package's own tests and
      # halo_extension_host's, which drive the real engine.
      #
      # This replaces a step that pointed LD_LIBRARY_PATH at flutter_js's
      # prebuilt bridge in the pub cache. That step outlived flutter_js: its
      # glob matched nothing, `echo` still exited 0, and CI went green having
      # set an empty LD_LIBRARY_PATH.
      - name: Build the host JS engine library
        if: matrix.package == 'packages/halo_quickjs' || matrix.package == 'packages/halo_extension_host'
        run: ./packages/halo_quickjs/tool/build_host.sh

      - name: pub get, analyze, test
        run: |
          cd "${{ matrix.package }}"
          flutter pub get
          # Fail on warnings and errors; infos (mostly framework-deprecation
          # churn in form_renderer) are surfaced but non-blocking so CI stays
          # actionable.
          flutter analyze --no-fatal-infos
          flutter test

  # app is the slowest package by far (~45% of the old single-job runtime),
  # so its `flutter test` run is sharded across runners on top of the job
  # split. `flutter analyze` only runs once, on shard 0, since it isn't
  # shardable and gains nothing from repeating it per shard.
  app-test:
    needs: extensions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      TOTAL_SHARDS: 3
    steps:
      - uses: actions/checkout@v4

      # mise provides the Flutter version pinned in mise.toml, so CI and local
      # runs use exactly the same toolchain.
      - name: Set up mise (Flutter toolchain)
        uses: jdx/mise-action@v2

      - uses: actions/download-artifact@v4
        with:
          name: extension-bundles
          path: app/assets/extensions

      # secrets.dart is gitignored, so a fresh checkout doesn't have it and the
      # app package fails to analyze. The blank template is a supported
      # configuration — every consumer degrades rather than failing, and the Map
      # tab falls back to OpenStreetMap. Same handling, and the same wording, as
      # scripts/test.sh:54-61.
      - name: Use blank secrets template
        run: |
          if [ ! -f app/lib/config/secrets.dart ]; then
            echo "no secrets present, using the blank template"
            cp app/lib/config/secrets.dart.example app/lib/config/secrets.dart
          fi

      # app's tests construct a real ExtensionService/ExtensionHost, so they
      # drive the JS engine — which under `flutter test` means the host build,
      # not a platform one. This job previously only pointed LD_LIBRARY_PATH at
      # flutter_js's prebuilt bridge and never built anything; with flutter_js
      # gone that glob matched nothing and the step passed regardless.
      - name: Build the host JS engine library
        run: ./packages/halo_quickjs/tool/build_host.sh

      - name: analyze
        if: matrix.shard == 0
        run: |
          cd app
          # Fail on warnings and errors; infos (mostly framework-deprecation
          # churn in form_renderer) are surfaced but non-blocking so CI stays
          # actionable.
          flutter analyze --no-fatal-infos

      - name: test (shard ${{ matrix.shard }} of ${{ env.TOTAL_SHARDS }})
        run: |
          cd app
          flutter test --total-shards="$TOTAL_SHARDS" --shard-index=${{ matrix.shard }}
