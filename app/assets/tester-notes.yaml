# Per-build "what's new for testers", shown in the tester overlay on the
# Dev and Next editions only — see config/tester_notes.dart. Keyed by the
# native build number (config/version.dart's kBuildNumber); testers see every
# entry newer than the last build they dismissed. Each entry under `changes`
# is rendered as markdown.
#
# Keep an entry to about a dozen words on one line: what changed and where to
# find it. A short ask ("tell us what works") fits; setup steps, caveats and
# rationale do not. One entry per change, never one per detail — and most
# changes get none at all, since only a new feature or a new control a tester
# can go and exercise earns one. Length is set by this rule, not by whatever
# the surrounding entries happen to look like — don't pattern-match off them.
#
# Notes are written as work merges, not at release time: add them under an
# `upcoming` key at the left margin, creating it when the last cut took it —
#
#     upcoming:
#       changes:
#         - "Something a tester should try, in markdown"
#
# `halo-ops release` renames that key to the build it ships in, so nobody
# types a build number here and no note lands under a build that never ships.
# `upcoming` is not a number, so the parser skips it: accumulated notes stay
# invisible to testers until the build carrying them exists.
#
# The cut refuses rather than ship something wrong — it rejects a key spelled
# any other way (`Upcoming`, a typo), a document that no longer parses, and a
# file with uncommitted changes; a key with no `changes` yet is simply left
# for the next cut. Notes belong to their own task's commit, not the
# release's.

"127":
  changes:
    - "Spots sorted **By Spot Time** are now truly time-ordered, not band-grouped"
    - "New **Group by Band** toggle in the Spots panel, independent of sort"
    - "Eleven more activities (ZLOTA, WWBOTA, WCA…) now accept multiple references, like POTA"
    - "TOTA towers finally have locations — distance, grid, map; refresh Data Files"
    - "Two dead Logging settings now work: report-order swap and RST auto-jump"
    - "**New State** and **New Province** pills for US/Canada, counted in Info"
    - "New **Avoid Zero-Beating on Spots** — CW spots land 10–25 Hz off"
    - "Every radio editor gets a **Report** button — tell us what works"
    - "Type **REPORT** plus what broke to file a real bug in-app"
    - "Worked spots are struck through and dimmed; your own call goes orange"
    - "Spots colour what's new: band green, mode, reference, multiplier in orange"

upcoming:
  changes:
    - "**Import QSOs from ADIF** in Operation Options, or drop a log file on the operation"
    - "Chasers get **New Reference** and **New Day** now — POTA/SOTA rules apply without activating"
    - "New **SET**, **SHOW** and **HIDE** commands — change a setting by name from the command bar"
    - "**All Settings** search now matches letters in order, like VS Code's file search"
    - "Adding a contest from the Operation Setup search now opens its setup form"
    - "Sync now starts on for new installs only — check yours didn't change"
    - "Version line names the code push as `build 131.2` — quote it whole in reports"
    - "Change your account email from the **Account** row in LoFi Cloud Sync"
    - "New **Connection Requests** row approves another device joining your account"
    - "A contest with no exchange set now says **Not configured!** on its row"
    - "Configurable activities get a settings button beside the delete button"
    - "Activity search: a leading `sota` puts SOTA's hits first, `sota:` shows only those"
    - "No GPS now says so in red, and tapping it takes a location you type"
    - "Denied location offers to ask again; a typed grid must be a real locator"
    - "**Personal Info** in the Callsign settings: name, email, club, ARRL/RAC section"

"126":
  changes:
    - "The Operation Setup sheet got a cleaner layout. Please test this and give feedback"
    - 'Windows data files now live in a private per-edition folder, inside AppData\Local. Please let us know if any data is lost during this migration'
    - "Uninstalling on Windows now asks whether to delete the app's data. Please try this."
    - "Callsign lookups pull activity references (POTA, SOTA, …) from recent spots"
    - "This very screen! Per-build notes for testers — type DEVTESTER to see it again"
