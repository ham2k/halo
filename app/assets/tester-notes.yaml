# Per-build "what's new for testers", shown in the tester overlay on the
# Dev and Next editions only — see config/tester_notes.dart. Keyed by the
# native build number (config/version.dart's kBuildNumber); testers see every
# entry newer than the last build they dismissed. Each entry under `changes`
# is rendered as markdown.
#
# Notes are written as work merges, not at release time: add them under an
# `upcoming` key at the left margin, creating it when the last cut took it —
#
#     upcoming:
#       changes:
#         - "Something a tester should try, in markdown"
#
# `halo-ops release` renames that key to the build it ships in, so nobody
# types a build number here and no note lands under a build that never ships.
# `upcoming` is not a number, so the parser skips it: accumulated notes stay
# invisible to testers until the build carrying them exists.
#
# The cut refuses rather than ship something wrong — it rejects a key spelled
# any other way (`Upcoming`, a typo), a document that no longer parses, and a
# file with uncommitted changes; a key with no `changes` yet is simply left
# for the next cut. Notes belong to their own task's commit, not the
# release's.

upcoming:
  changes:
    - "Spots sorted **By Spot Time** now really are in time order — they used to stay grouped by band no matter the sort. Please check the order looks right to you"
    - "New **Group by Band** toggle in the Spots panel, independent of the sort: on gives you the band sections you're used to, off gives one flat list. Try it both ways and tell us which you'd want as the default"
    - "ZLOTA, WWBOTA, WCA, TOTA, SiOTA, MOTA, LLOTA, ELA, ECA, BLHA and BCA now let you activate several references at once (n-fers), same as POTA already did. Please try stacking references for one of these on an operation"
    - "TOTA towers had no location at all — no distance, no grid, nothing on the map. Fixed. If you already downloaded the tower list, refresh it under **Settings → Data Files** to pick this up now (otherwise it sorts itself out within 30 days), then check that a tower shows a distance"
    - "Notices (the post-it cards above the status bar, and About → Notices & Messages) stay black-on-yellow in **dark mode** instead of flipping to yellow-on-olive. Please check they still read well at night and don't feel too bright"
    - "Two Logging settings that did nothing now work — both off by default, under **Settings → Logging → show more settings**. **Switch signal report order** puts Rcvd before Sent everywhere at once: the entry row, the Space/Tab order through it, the QSO list and the More pane. **Jump to next field on RST entry** moves focus on as soon as a report is complete. Please try each one and tell us whether either should be easier to find"
    - "With **Jump to next field on RST entry** on, a report is 'complete' at two characters on phone and three on CW/RTTY — so `44` on CW waits for its `A`, and `5NN` still works. It doesn't apply on FT8/FT4 at all, where a report has no fixed length. One known cost: with it on you can't type `59+` on phone, because the jump has already fired. Leave it off if you give `59+`"
    - "If you log phone with a radio connected, your default report was `599` instead of `59` — the app was reading the rig's `USB`/`LSB` as a data mode. Now `59`, same as picking SSB by hand. Please check the Sent/Rcvd hints look right on your rig"
    - "The scoring pills next to a call you're typing got quieter and smarter. **New Band** and **New Mode** now only appear for a station already in this log, worked this time on a band or mode you hadn't worked *them* on — the first QSO of an operation no longer lights up as new on every axis. **New DXCC** no longer fires for your own entity. Please tell us whether the pills that remain are the ones you actually want mid-pileup"
    - "US and Canadian operators get two new pills: **New State** and **New Province**, the first time you work each one in an operation — including your own state, which is a credit you can claim. The state comes from the callsign lookup or from what you type in the State field. The Info tab counts them beside your DXCC entities. Please check the state it picks up matches who you actually worked"
    - "The **Info** tab now breaks your operation down by band: one row per band you've worked, with its contact count and how those split across modes. Please check the numbers match what you'd count by hand"
    - "**Web only:** the search box in **Settings → All Settings** dropped the caret after a character or two, swallowing the rest of what you typed. Fixed. Please type a few settings names in there and check every character lands"
    - "New **Avoid Zero-Beating on Spots**, off by default — switch it on under **Settings → Radio** (that whole section needs the *Station Configuration* experiment). With a radio connected, tapping a **CW** spot then lands you 10-25 Hz off the spotted frequency instead of exactly on it, so a pileup isn't everyone calling on one note. Please turn it on for a session, check the frequency you end up on looks right in the log, and tell us whether the spread feels too small or too large — there's a range setting beside it (10/25/50/75 Hz) under \"show more settings\". Nothing changes without CAT, on phone and data spots, or on 630m/2190m"
    - "The **Frequency** field in the Radio control now also takes a band: type `40`, `40m` or `70cm` and, when you leave the field, it sets the band and clears itself — same as picking from the Band dropdown beside it. Bare numbers work so this is usable on a phone, where that field's keyboard has no letters. Real frequencies are untouched. Please check that typing a frequency digit by digit never trips it up"
    - "Every radio in **Settings → Station Configuration** now has a **Report** button beside Save when you open it. Tell us what rig you actually have and whether it worked — especially if you're using one of the *Generic* entries, where we have no way of knowing what's on the other end of your cable. There's a separate box for troubleshooting hints, and what you write there may end up in the app for the next person with your radio. It needs your LoFi account linked, same as REPORT. Please file one for each rig you own, working or not, and tell us whether it asked you anything it should already have known"
    - "Type **REPORT** and what went wrong (in the command bar or Quick Lookup) to file a bug without leaving the app — it opens a real card for us, stamped with which build you're on and the operation you had open. Needs your LoFi account to be linked. Lower case now stays lower case while you type it. Please try it on something small and tell us whether the confirmation told you what you needed"
    - "Commands with something typed after them — `NOTE`, `REPORT`, `SEED 15 3H` — kept losing the space if you typed them quickly in the command bar (⌘K) or Quick Lookup, and shouting what you typed after it. Both fixed: type them as fast as you like and only the command word gets capitalised. Please hammer at that field — type a REPORT straight through with no pause, and check that a plain callsign still comes out in capitals"

"126":
  changes:
    - "The Operation Setup sheet got a cleaner layout. Please test this and give feedback"
    - 'Windows data files now live in a private per-edition folder, inside AppData\Local. Please let us know if any data is lost during this migration'
    - "Uninstalling on Windows now asks whether to delete the app's data. Please try this."
    - "Callsign lookups pull activity references (POTA, SOTA, …) from recent spots"
    - "This very screen! Per-build notes for testers — type DEVTESTER to see it again"
