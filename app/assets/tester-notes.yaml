# Per-build "what's new for testers" — Dev and Next editions only, keyed by
# the build number. Write notes under an `upcoming` key; the release cut
# renames it, so never type a build number here.
#
# How to write one, and what never goes in: docs/releases.md §2.7.

upcoming:
  changes:
    - "Add a Panel: tap anywhere on a row; search offers panel extensions to enable"
    - "QSO Party exchanges are labelled QP Location, and fill in what a station sent before, even last year"
    - "Out-of-state stations in the Pennsylvania QSO Party now send ARRL/RAC sections"

"170":
  changes:
    - "Hover or drag across the Weather chart to inspect each hour’s forecast"
    - "A full ADIF export's QSL Message now names the programs, as \"POTA US-0001 & WWFF KFF-0002\""
    - "Spots you post now say SSB, not USB or LSB — unless you're on the band's other sideband"
    - "Add a radio by name: Icom IC-7100, prefilled with its CI-V address"

"169":
  changes:
    - "Customize export data and templates by type in Settings → Exports"
    - "New Show Deleted Operations preference; a deleted operation's Tools menu offers Undelete"
    - "The Pennsylvania QSO Party now exchanges serial numbers"
    - "QSOs with a note show a note icon in their row"
    - "Esc no longer wipes the QSO being typed — Alt+W wipes, Cmd/Ctrl+Z undoes it"
    - "CW messages can send contest serials and cut numbers — the Messages dialog's new Help shows how"

"168":
  changes:
    - "WWFF, LLOTA, WWBOTA, MOTA, SiOTA, TOTA and ZLOTA references now autoformat as you type, like POTA's"

"167":
  changes:
    - "Extension rows now carry an (i) for details, and Remove has moved in there"
    - "The QSO list leads a noted station's name with its Callsign Notes emoji"
    - "On a phone with PoLo installed, onboarding and Settings › Switch Accounts offer to link its account directly"

"165":
  changes:
    - "BG2FX FX-4CR in the radio list, on the Kenwood protocol — tell us how it behaves"
    - "Phone contacts now read as SSB, not USB/LSB — an unexpected sideband shows red"
    - "A radio that knows which of its ports carries CAT now points at it, without hiding the others"
    - "Desktop and web builds now say Power Logger; phones keep Portable Logger"
    - "New Grid Precision setting: grids now show 6 digits by default, 8 if you prefer"
    - "New Keep Device Awake setting: no sleep while you log or a sync runs, 15 idle minutes lets go"

"164":
  changes:
    - "A warning pill in the logging panel when the contact has no band or no mode"
    - "New optional Notes control in the logging row: turn it on to jot a note per contact"
    - "The More pane now edits every field a contact holds, in sections: city, county, zones, ARRL section, coordinates and their power"
    - "ADIF exports now carry DXCC, CQ and ITU zones, county, power, split and TIME_OFF"
    - "Guohetec Q900 in the radio list, on its own protocol — tell us how it behaves"
    - "An unrecognized reference is marked, not dropped — it logs and exports as typed"

"163":
  changes:
    - "Microwave bands by name in the call field: 10G, 24G, 47G and the rest"
    - "The band command now takes every band the app has, plus 75m for 80m"
    - "Operation's callsign is now per-segment"
    - "Android: a radio or bridge with two serial ports lists both, and the X6100 and Yaesus pick their CAT port for you"
    - "An operation with a reference from a switched-off extension now offers to enable it"
    - "The Radio panel shows TX, power out, SWR and supply volts while you transmit, and warns above 1.8 SWR"
    - "The serial port picker suggests your radio's port, flags one just plugged in, and refreshes while open"
    - "A WinKeyer now asks which of its two jacks your radio is on, and no longer dead-keys"
    - "New QSO Parties extension: 49 state and provincial parties, with counties, county lines and Cabrillo"
    - "Settings is now one panel: Common Settings on top, every category below it, one open at a time"

"162":
  changes:
    - "Change an operation's callsign and it offers to update the contacts already logged"

"161":
  changes:
    - "Type a grid with no call and the logging panel shows the distance and bearing to it"
    - "Show Bearing has a new option to also show the reverse bearing, as 45° / 225°"
    - "The call info area shows how many times you have worked the station before"
    - "START, BREAK, STOP and ROVERQTH commands mark the segments of an operation from the call field"
    - "Country Flags in Logging settings: flags for all contacts, DX only, or none"
    - "New IARU Region 1 Field Day extension, ready for the September SSB weekend"
    - "New NRRL Nasjonal Field Day extension, for Norway's national field day"
    - "Windows: com.ham2k links now open the app, so QR device linking works there"
    - "The antenna and key in use are remembered per radio, and follow the one you pick"
    - "Add an Elecraft by name: KX2, KX3 or a generic Elecraft, prefilled to match"
    - "Companion apps can now set your VFO, suggest a contact, or open an operation"

"160":
  changes:
    - "Support for contest serial number"
    - "The spots mode filter has a combined Phone & CW option"

"159":
  changes:
    - The operator callsign now travels with the operation, stored per operating position
    - "Edit QSO can now set the operator, and the position at a multi-station"
    - "New optional Power control in the logging row: turn it on to log the watts of each QSO"
    - "Add a Generic Placeholder Radio to log with no rig connected"
    - "Sync settings now names what is still waiting to upload, instead of only two totals"
    - "The status bar is always there: tap the icons at its right to see what each reports"

"158":
  changes:
    - "State Parks exports: Ohio's Cabrillo, and Texas/Georgia per-park ADIFs named as their rules require"
    - Each QSO now records the operator and position that logged it; ADIF exports say so
    - "Add a radio by name: IC-7300 MK2, IC-7610, IC-7760 and the Xiegu X6100, prefilled to match"
    - "Exporting now confirms what it wrote and where — tell us if the wording misses anything"

"156":
  changes:
    - "New CWops CWT extension: it offers the session three hours before each one starts"
    - Spanish now covers QSO import, test operations and the activity results map
    - Phones can now rearrange their layout too, kept separately from the wide one
    - Drop a tab onto a pane's centre to stack them both under one tab
    - "Custom Text panel: turn LAYOUTS on, enable it in Extensions, then add it to a pane"
    - SOTA activation zones are outlined on the Map tab and in Operation Setup, kept offline

"155":
  changes:
    - FlexRadio equipment now picks which slice to follow, and shows what each one is doing
    - Home's quick lookup now shows full call info; press Enter for the whole panel
    - "Add a radio by name: IC-7300, IC-706MKIIG, FT-710, FTDX10 and QRP Labs QMX"
    - Activity rows in Operation Setup link out to the program's own page, or a contest's rules

"153":
  changes:
    - Type `OPER KI2D` in the call field to set who is at the key for an operation
    - "`POSITION 2` marks this device in a multi-station op; its spots go out as /OP2"
    - "New Solar panel: flux, wind and Kp charts, band conditions, hover for values"
    - "With Developer Mode on, add a Fake Radio to try radio control with no rig"
    - "Settings › General › Number Formatting: period or comma decimals, or follow your device"
    - Radio pill reads OOB, in red, on frequencies your ITU region does not allow

"150":
  changes:
    - Radio pill and QSO frequencies turn red when there is no band
    - Peer sync copies an operation open on one device to your other devices on the same account
    - QRZ photos show in Call Info again; tap one to see it full size
    - Signing in to SOTA and other accounts now happens in your own browser

"149":
  changes:
    - Tap a date header in the QSO list to open the operation info
    - Status bar shows an offline icon; tap it for detail and a retry
    - Settings has a new Help & Resources section with community links
    - "Windows: updating no longer stalls with the old app still running"

"148":
  changes:
    - Spots survive a brief network drop, and never show older than 3 hours

"147":
  changes:
    - Locations now keep full coordinates, so grids show finer and distances sharpen
    - ADIF exports now carry your own grid square, and coordinates with private data on

"146":
  changes:
    - Lookups now tidy up names and towns, and show QRZ nicknames
    - Swiping spot rows now works even better

"145":
  changes:
    - "iOS/Android: Check for Updates now finds new builds and opens the store"
    - Swipe a spot row right to log it, left to set it aside
    - Your own spot pins atop the spots list; tap it to retune there

"144":
  changes:
    - Callsign-note keys now expand inside a stack too, e.g. "KI2D//1AB"
    - Emoji should now work better on Windows, including flags.

"143":
  changes:
    - Listen for other apps (WSJT-X, N1MM+) in the "Imports" section of Operation view
    - "Worked-before contacts now suggest name/location from your own log (Call History lookup)"
    - Operation Info's Scoring section now breaks down activity/contest progress per day
    - "Android: plugging in a USB-serial CAT adapter now offers to open HaLo"

"142":
  changes:
    - "New PURGETESTS command bulk-deletes Test Operations (station call ending /T or /TEST)"
    - Android USB serial should (well, "might") work now

"139":
  changes:
    - "New **Ham2K Lookup Service** callsign lookup (free, covers US/Canada/Germany), replacing HamDB"
    - "Operation Setup's Suggestions & Search now has a map toggle next to the search field"

"136":
  changes:
    - "Clock, Weather and Web Site panes can now be added to Home and the Logs view, not just an operation"
    - "Weather pane's Location setting now offers a 'use the operation's location' checkbox"
    - "Dialog backdrops in dark mode now lighten instead of darken"

"133":
  changes:
    - "Android: USB-serial radios now show up as CAT connection options"
    - "Exports panel offers a separate hunter/chaser log for any hunted references"
    - "Operation header: Options/Export moved to the top bar, with an OK button for Operation Setup"
    - "Operation Setup: search fields now have a clear (X) button"

"132":
  changes:
    - "Home has a navigation sidebar, and its panes rearrange like an operation's — try both"
    - "Maps: using Maplibre now, with map style selection and other tweaks"
    - "New **Weather** pane — conditions now, over a curve of the next eight hours"
    - "Pane layout options: panel settings embed inline, plus a new Theme Mode override"
    - "Events (NOTE/TODO/BREAK) are now editable"

"131":
  changes:
    - "Use the `LAYOUT` command to enable layout customization."
    - "New **Clock** pane — LCD, analog or Swiss railway face, in any time zone"
    - "New **Web Site** pane — point it at a page, optionally refreshing on a timer"

"130":
  changes:
    - "The Spots panel now shows the current QSO being logged, if present in the spots."
    - "**Enable Layout Customization** in Settings, then rearrange the logging view's panes"

"128":
  changes:
    - "**Import QSOs from ADIF** in Operation Options, or drop a log file on the operation"
    - "Chasers get **New Reference** and **New Day** now — POTA/SOTA rules apply without activating"
    - "New **SET**, **SHOW** and **HIDE** commands — change a setting by name from the command bar"
    - "Configurable activities get a settings button beside the delete button"
    - "Activity search: a leading `sota` puts SOTA's hits first, `sota:` shows only those"
    - "No GPS now says so in red, and tapping it takes a location you type"
    - "Denied location offers to ask again; a typed grid must be a real locator"
    - "**Personal Info** in the Callsign settings: name, email, club, ARRL/RAC section"
    - "Dialog buttons moved: Cancel now sits beside Save, and **Done** replaces Close/Apply"

"127":
  changes:
    - "Spots sorted **By Spot Time** are now truly time-ordered, not band-grouped"
    - "New **Group by Band** toggle in the Spots panel, independent of sort"
    - "Eleven more activities (ZLOTA, WWBOTA, WCA…) now accept multiple references, like POTA"
    - "TOTA towers finally have locations — distance, grid, map; refresh Data Files"
    - "Two dead Logging settings now work: report-order swap and RST auto-jump"
    - "**New State** and **New Province** pills for US/Canada, counted in Info"
    - "New **Avoid Zero-Beating on Spots** — CW spots land 10–25 Hz off"
    - "Every radio editor gets a **Report** button — tell us what works"
    - "Type **REPORT** plus what broke to file a real bug in-app"
    - "Worked spots are struck through and dimmed; your own call goes orange"
    - "Spots colour what's new: band green, mode, reference, multiplier in orange"

"126":
  changes:
    - "The Operation Setup sheet got a cleaner layout. Please test this and give feedback"
    - 'Windows data files now live in a private per-edition folder, inside AppData\Local. Please let us know if any data is lost during this migration'
    - "Uninstalling on Windows now asks whether to delete the app's data. Please try this."
    - "Callsign lookups pull activity references (POTA, SOTA, …) from recent spots"
    - "This very screen! Per-build notes for testers — type DEVTESTER to see it again"
