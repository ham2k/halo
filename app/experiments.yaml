# Experimental features (toggled with the EXP command, or from Settings →
# Developer → Experiments). Each entry:
#
#   - key: layouts            # stable id — settings persist under this key
#     name: Customizable Layouts
#     description: Optional one-liner shown in the Experiments screen.
#     aliases: [layout, dock] # extra words the EXP command accepts
#     hidden: true            # optional — EXP still works, but the entry is
#                             # not listed in the Experiments screen
#
# Removing an entry here does NOT delete its persisted state — a user who
# had it enabled gets it back if the entry returns.
#
# Keys and aliases must be unique across entries: the EXP command resolves
# a token to the FIRST entry that matches, so a shared alias silently
# toggles the earlier entry.

experiments:
  # Meta-experiment: gates the Experiments list itself in Developer
  # Settings. Off by default, so the list only appears once someone has
  # typed EXP EXPERIMENTS (or EXP EXP) — and since it's listed (not
  # hidden), it can be switched back off from the very list it reveals.
  - key: experiments
    name: Experiments
    description: Show the Experiments list in Developer Settings.
    aliases: [exp]
  # Not the dock itself — that ships behind Settings → User Interface →
  # Enable Layout Customization (docs/design/layouts.md), which is an
  # operator's choice rather than a tester's. This gates the DASHBOARD PANEL
  # extensions: their manifests list this key, so Solar and Custom Text stay
  # out of the Extensions panel and out of the runtime until it is on.
  # Rearranging the panes that already ship needs only the setting, and so do
  # the NATIVE panels — Clock, Weather and Web Site are not extensions and
  # this key does nothing for them.
  #
  # Panel words only. `layouts`, `layout`, `dock` and `docking` all named the
  # DOCK, which is now the LAYOUTS command's setting — one word reaching two
  # switches is worth more confusion than it saves typing. State does not
  # follow a key change either, so anyone who had EXP LAYOUTS on turns
  # EXP PANELS on once.
  - key: panels
    name: Dashboard Panels
    description: Extra panels to put in a customized layout — solar, custom text.
    aliases: [panel]
  # Station equipment and CAT control (docs/design/cat.md). Reveals the
  # Station Configuration settings section, on every platform including web
  # (HALO-64: the serial transport works there via the Web Serial API).
  # A radio needing TCP or the Icom network transport still fails loudly at
  # connect on web — neither has a web implementation — same as before.
  # The key stays 'gato' on purpose. It is what is written into stored
  # settings, so renaming it silently turns the experiment off for
  # everyone who has it on. The codename is retired from the code; the
  # persisted key is not worth a migration, because 'cat' is already an
  # alias and `EXP CAT` is what anyone actually types.
  - key: gato
    name: Station Configuration
    description: Connect and control radios and other station equipment.
    aliases: [cat, rig]
  # A home-rail destination listing every station callsign ever logged, with
  # a virtualized table of that callsign's QSOs across all operations —
  # independent of the Operations list, which is per-operation.
  - key: logs
    name: Logs
    description: A rail destination listing all QSOs across operations, by station callsign.
  # Direct device-to-device sync over the local network (HALO-310): the Peer
  # Devices settings panel, and everything under it. With this off nothing
  # binds a socket, nothing is announced, and this device is invisible to
  # the network — the gate sits at `HaLoServices.updatePeerSharing`, which
  # is the only path that starts any of it.
  #
  # Gated for two reasons beyond newness. It authenticates nothing: a peer
  # is admitted on the device id it claims plus the operator confirming it
  # once, and anything on the same network segment can claim an id it has
  # seen. And Android's local-network permissions are unverified on real
  # hardware (HALO-309), so discovery there may simply find nothing.
  - key: p2p
    name: Peer Devices
    description: Share the open operation with your other devices on the same network.
    aliases: [peers, peer]

