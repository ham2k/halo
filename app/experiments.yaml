# Experimental features (toggled with the EXP command, or from Settings →
# Developer → Experiments). Each entry:
#
#   - key: layouts            # stable id — settings persist under this key
#     name: Customizable Layouts
#     description: Optional one-liner shown in the Experiments screen.
#     aliases: [layout, dock] # extra words the EXP command accepts
#     hidden: true            # optional — EXP still works, but the entry is
#                             # not listed in the Experiments screen
#
# Removing an entry here does NOT delete its persisted state — a user who
# had it enabled gets it back if the entry returns.
#
# Keys and aliases must be unique across entries: the EXP command resolves
# a token to the FIRST entry that matches, so a shared alias silently
# toggles the earlier entry.

experiments:
  # Meta-experiment: gates the Experiments list itself in Developer
  # Settings. Off by default, so the list only appears once someone has
  # typed EXP EXPERIMENTS (or EXP EXP) — and since it's listed (not
  # hidden), it can be switched back off from the very list it reveals.
  - key: experiments
    name: Experiments
    description: Show the Experiments list in Developer Settings.
    aliases: [exp]
  - key: layouts
    name: Customizable Layouts
    description: Rearrange the logging view's panes by dragging their tabs into splits and groups.
    aliases: [layout, dock, docking]
  # Station equipment and CAT control (docs/design/gato.md). Reveals the
  # Station Configuration settings section. Does nothing on web, which has
  # no sockets — the section stays hidden there even with this on.
  - key: gato
    name: Station Configuration
    description: Connect and control radios and other station equipment.
    aliases: [cat, rig]

