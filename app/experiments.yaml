# Experimental features (toggled with the EXP command, or from Settings →
# Developer → Experiments). Each entry:
#
#   - key: spotlight          # stable id — settings persist under this key
#     name: Spotlight
#     description: Optional one-liner shown in the Experiments screen.
#     aliases: [spot, light]  # extra words the EXP command accepts
#     private: true           # optional — EXP still works, but the entry is
#                             # not listed in the Experiments screen
#
# Removing an entry here does NOT delete its persisted state — a user who
# had it enabled gets it back if the entry returns.
#
# Keys and aliases must be unique across entries: the EXP command resolves
# a token to the FIRST entry that matches, so a shared alias silently
# toggles the earlier entry. They must also stay clear of the SETTINGS
# vocabulary (core_settings_groups.dart) — a word reaching both an
# experiment and a setting is worth more confusion than it saves typing.

experiments:
  # Keying through a CAT radio: F1-F8 messages — CW text, or the radio's
  # own voice memories in a Phone mode — the keyer area, WPM and KEYER
  # (docs/design/cat.md § CW keying, § Voice keying). Gated on its own so
  # the keying surfaces can be tried — or left off — separately from the rest
  # of CAT.
  - key: keyer
    name: Keying
    description: Key CW messages, or play the radio's voice memories, on F1-F8 through a CAT-controlled radio.
    aliases: [cw, macros, voice]
  # Enter Sends Messages (docs/design/logging-fields.md § Enter Sends
  # Messages): Enter keys the exchange as well as logging it, N1MM-style,
  # with the keyer area's ESM pill and ESM/RUN/SP. On top of Keying, and
  # gated on its own because it changes what Enter does — the one key every
  # operator relies on to log.
  - key: esm
    name: Enter Sends Messages
    description: Enter keys the exchange's CW messages or voice memories as it moves through a contact.
  # The CAT server (docs/design/cat.md § CAT server): other apps control the
  # Main VFO radio through HaLo, which stands in for rigctld, flrig, Ham
  # Radio Deluxe or N3FJP. Gated because it opens a listening socket.
  - key: server
    name: CAT Server
    description: Let other apps (WSJT-X, loggers, etc) control the radio through Ham2K Logger.
  # A home-rail destination listing every station callsign ever logged, with
  # a virtualized table of that callsign's QSOs across all operations —
  # independent of the Operations list, which is per-operation.
  - key: logs
    name: Logs
    description: A rail destination listing all QSOs across operations, by station callsign.
  # A home-rail destination for chasing — hunting parks, summits and the
  # like — that logs contacts belonging to no operation, the same loose
  # bucket an ADIF import into Logs fills.
  - key: chase
    name: Chasing
    description: A rail destination for logging contacts while chasing parks, summits and more, outside of any operation.
    aliases: [hunt]
    private: true
  # Direct device-to-device sync over the local network (HALO-310): the Peer
  # Devices settings panel, and everything under it. With this off nothing
  # binds a socket, nothing is announced, and this device is invisible to
  # the network — the gate sits at `HaLoServices.updatePeerSharing`, which
  # is the only path that starts any of it.
  #
  # Gated for two reasons beyond newness. It authenticates nothing: a peer
  # is admitted on the device id it claims plus the operator confirming it
  # once, and anything on the same network segment can claim an id it has
  # seen. And Android's local-network permissions are unverified on real
  # hardware (HALO-309), so discovery there may simply find nothing.
  - key: p2p
    name: Peer Devices
    description: Share the open operation with your other devices on the same network.
    aliases: [peers, peer]

  # Screen sharing between paired devices (HALO-369): a device offers a set
  # of screens, applications and windows, and a peer's Remote Screen panel
  # subscribes to one of them over the LAN peer link.
  #
  # Sits ON TOP of p2p rather than beside it — with peer sharing off there is
  # no session to carry an offer, so this key does nothing on its own. The
  # gate belongs at the path that STARTS CAPTURE, not only on the settings
  # row: an install without the experiment must never hold a Screen Recording
  # grant open or run an SCStream, the same reasoning that puts p2p's gate at
  # updatePeerSharing rather than on its panel.
  #
  # macOS is the only device that can offer a screen today; every platform
  # with a peer link can view one.
  - key: remote
    name: Remote Screens
    description: Show a screen or window from one of your other devices in a panel.
    aliases: [screens, screenshare]
    private: true
  # The Lab599 TX-500 and TX-500MP, through the LiNK500MP among other ways,
  # and the Bluetooth LE serial pairing every serial radio derives
  # (docs/design/cat.md § Bluetooth LE serial). Gated because neither has
  # been on the bench: the LiNK500MP's GATT table is unpublished and the
  # TX-500 protocol comes from references, not a capture. The gate holds
  # back only the catalogue's offer (`isBehindTx500Experiment`) — a radio
  # already added keeps connecting with it off.
  - key: 500mp
    name: Lab599 TX-500 and Bluetooth LE radios
    description: Offer the Lab599 TX-500 and TX-500MP, and Bluetooth LE connections to radios through a serial bridge.
    aliases: [tx500, link500]
    private: true
  # SDR receivers as the source of a radio's panadapter and waterfall
  # (docs/design/cat.md § SDR receivers): offered under Other Equipment, and
  # drawn in place of the radio's own scope. Gated because no SDR has been on
  # the bench. The stored key stays `fall`: a new key would switch it off for
  # every tester who has it on.
  - key: fall
    name: SDR Receivers
    description: Add SDR receivers as equipment, to show a radio's panadapter and waterfall.
    aliases: [sdr]
  # Named layouts (docs/design/layouts.md § Named layouts): several layouts
  # per docked view, a switcher beside the layout button, and layout files —
  # exporting all or part of one, and importing one as a new layout, in place
  # of the one on screen, or beside it.
  - key: layouts
    name: Named Layouts
    description: Keep several layouts per view, switch between them, and export or import them as files.
    aliases: [dashboards]
  # Keyboard shortcuts as settings (docs/design/keyboard-shortcuts.md): the
  # Keyboard Shortcuts panel, keys bound to commands and to typed command
  # text, and `.h2kkey` files. Gated because it changes what keys do even
  # untouched: the defaults hold only the platform's own command key, so ⌃K
  # and ⌃F go back to text editing on a Mac.
  - key: kb
    name: Keyboard Shortcuts
    description: Choose the keys for commands, bind keys to typed commands, and export or import them as files.
    aliases: [keys, shortcuts]
  # Single Operator Two Radios: a Radio B in Station Configuration, driving
  # `vfoB`, and a logging panel with one set of main fields per radio under
  # a shared strip (docs/design/logging-fields.md § SO2R). Private because the
  # two-set panel is still being shaped.
  - key: so2r
    name: SO2R
    description: Control a second radio, with a set of logging fields for each.
    private: true
