<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ham2K Logger — a modern amateur radio logging app.">
  <meta name="theme-color" content="#006783">
  <meta name="background-color" content="#FBFCFE">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Browser Logger (Dev)">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Browser Logger (Dev)</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown the instant the page loads, before the Flutter engine (a
       multi-MB download) has even started. Background matches
       lib/views/splash_view.dart's SplashScreen (which takes over once
       Flutter paints) and, past that, the empty-operations-list state
       (colorScheme.surfaceContainerHighest) — so there's no visible color
       change across any of this app's loading stages. Follows the system
       light/dark setting, same as SplashScreen (the in-app override lives
       in SettingsService, which isn't loaded yet at this point either).
       Colors are halo_widgets/theme.dart's buildHaLoTheme() literals.
       Faded out as soon as Flutter paints — see the script below — since by
       then it's indistinguishable from SplashScreen underneath; a fast fade
       instead of an instant swap avoids a one-frame flicker between the two
       (different rendering pipelines — the browser compositor vs. Flutter's
       canvas — don't swap on exactly the same frame). */
    #startup-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #DCE4E9;
      z-index: 9999;
      opacity: 1;
      transition: opacity 50ms linear;
    }
    #startup-splash.startup-splash-hidden {
      opacity: 0;
    }
    #startup-splash img {
      /* The column below is centered as a whole, but the spinner's own
         height + margin (32px + 32px = 64px) only sits below the logo, not
         above it — without this, that pushes the logo above true center.
         Matching top margin balances it back to dead center, same position
         as lib/views/splash_view.dart's SplashScreen (which has no spinner
         to make room for). */
      margin-top: 64px;
      width: 180px;
      height: 180px;
    }
    #startup-splash .spinner {
      margin-top: 32px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 103, 131, 0.25);
      border-top-color: #006783;
      border-radius: 50%;
      animation: startup-splash-spin 0.8s linear infinite;
    }
    @keyframes startup-splash-spin {
      to { transform: rotate(360deg); }
    }
    /* Boot-failure state (#76): shown in place of the spinner when the
       Flutter engine hasn't painted a first frame within the timeout below.
       Hidden until the script flips it on. */
    #startup-error {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 32px;
      padding: 0 24px;
      max-width: 28em;
      text-align: center;
      color: #1A1C1E;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #startup-error button {
      margin-top: 16px;
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      background: #006783;
      color: #FFFFFF;
      font-size: 14px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      #startup-splash {
        background: #40484C;
      }
      #startup-error {
        color: #E1E3E5;
      }
    }
  </style>
</head>
<body>
  <div id="startup-splash">
    <img src="ham2k-square.svg" alt="">
    <div class="spinner"></div>
    <div id="startup-error">
      <div><strong>Ham2K Logger failed to start.</strong></div>
      <div>Check your connection and reload the page. If this keeps
        happening, please let us know at help@ham2k.com.</div>
      <button type="button" onclick="location.reload()">Reload</button>
    </div>
  </div>
  <script>
    // Substituted at deploy time by CI (see .github/workflows/deploy-web.yml
    // and docs/deployment.md); left as the placeholder — and therefore
    // disabled — in local/dev builds, same convention as the Mapbox token.
    const HALO_SENTRY_DSN = '%%HALO_SENTRY_DSN%%';

    let firstFramePainted = false;

    function removeSplash() {
      firstFramePainted = true;
      const splash = document.getElementById('startup-splash');
      if (!splash) return;
      splash.classList.add('startup-splash-hidden');
      setTimeout(() => splash.remove(), 50);
    }

    // The documented hook: Flutter's own bootstrap dispatches this once its
    // first frame is actually painted — almost always Flutter's own
    // SplashScreen widget (lib/views/splash_view.dart), not the real app,
    // since bootstrap() is usually still running at that point. That's fine
    // here on purpose: SplashScreen uses the exact same background and logo
    // (and centering — see the img margin-top above) as this HTML splash, so
    // the swap is an intentional no-op visually. main.dart's _BootGate then
    // fades from SplashScreen into the real app once bootstrap() resolves.
    window.addEventListener('flutter-first-frame', removeSplash);

    // Boot-failure state (#76): if the engine hasn't painted anything by
    // this deadline (network failure downloading the multi-MB engine, a
    // crash before the first frame, an unsupported browser), tell the user
    // instead of spinning forever, and report one event to Sentry when a
    // DSN was baked in. The Flutter app can't report this itself — it never
    // started — so this tiny hand-rolled envelope POST is the only
    // reporter; no JS SDK, nothing to download.
    const BOOT_TIMEOUT_MS = 30000;

    function reportBootFailure() {
      if (!HALO_SENTRY_DSN || HALO_SENTRY_DSN.startsWith('%%')) return;
      try {
        // DSN: https://<key>[:<legacy secret>]@<host>/[<path prefix>/]<projectId>
        // (the legacy secret is dropped — sentry_key alone authenticates; the
        // optional path prefix covers self-hosted Sentry installs).
        const m = HALO_SENTRY_DSN.match(/^https:\/\/([^:@]+)(?::[^@]*)?@([^/]+)\/(.*?)(\d+)$/);
        if (!m) return;
        const [, key, host, pathPrefix, projectId] = m;
        const event = {
          message: 'Web app failed to start within ' + (BOOT_TIMEOUT_MS / 1000) + 's',
          level: 'error',
          platform: 'javascript',
          environment: '%%HALO_WEB_ENVIRONMENT%%'.startsWith('%%') ? 'unknown' : '%%HALO_WEB_ENVIRONMENT%%',
          tags: { boot_stage: 'pre-first-frame' },
          request: { url: location.href, headers: { 'User-Agent': navigator.userAgent } },
        };
        const envelope =
          JSON.stringify({ sent_at: new Date().toISOString() }) + '\n' +
          JSON.stringify({ type: 'event' }) + '\n' +
          JSON.stringify(event) + '\n';
        fetch('https://' + host + '/' + pathPrefix + 'api/' + projectId + '/envelope/?sentry_key=' + key + '&sentry_version=7', {
          method: 'POST',
          body: envelope,
          keepalive: true,
        }).catch(() => {});
      } catch (e) { /* reporting must never break the error screen itself */ }
    }

    setTimeout(() => {
      if (firstFramePainted) return;
      const spinner = document.querySelector('#startup-splash .spinner');
      if (spinner) spinner.remove();
      const errorBox = document.getElementById('startup-error');
      if (errorBox) errorBox.style.display = 'flex';
      reportBootFailure();
    }, BOOT_TIMEOUT_MS);
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
