org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_js still compiles Kotlin at JVM target 1.8 while Java is 11;
# relax the mismatch to a warning until we bind QuickJS directly.
kotlin.jvm.target.validation.mode=warning

# AGP 9 dropped support for getDefaultProguardFile('proguard-android.txt') (it
# bundles -dontoptimize, which blocks most R8 optimizations). We don't reference
# it anywhere, but flutter_inappwebview_android 1.1.3 — the latest published
# version — still does, in BOTH its debug and release buildTypes, so *every*
# Android build (and `shorebird init`) dies while evaluating that subproject:
#   .../flutter_inappwebview_android-1.1.3/android/build.gradle line 44
# This is AGP's documented temporary escape hatch to keep accepting the old file.
# Remove it once flutter_inappwebview ships an AGP-9-compatible release — see
# upstream pichillilorenzo/flutter_inappwebview issues #2765 and #2852.
android.r8.proguardAndroidTxt.disallowed=false
