name: ham2k_logger
description: "Ham2K Portable Logger Next — Flutter app with a TypeScript extension runtime."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  halo_extension_host:
    path: ../packages/halo_extension_host
  halo_tls_psk:
    path: ../packages/halo_tls_psk
  halo_core:
    path: ../packages/halo_core
  halo_i18n:
    path: ../packages/halo_i18n
  halo_widgets:
    path: ../packages/halo_widgets
  halo_build_tools:
    path: ../packages/halo_build_tools
  # DeepCollectionEquality for the lookup queue's changed-result check;
  # version left to Flutter's own pin of this package.
  collection: any
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  # The connection type drift_flutter's `setup` hook is handed (see
  # logDatabaseOptions), and the raw connections tests open beside drift.
  # Transitive via drift; named here to be importable.
  sqlite3: ^2.4.0
  # Reading and unpacking .h2kext extension bundles (HALO-422). Already
  # present transitively; named here because a transitive dependency cannot
  # be imported.
  archive: ^4.0.0
  # Checking a .h2kext's declared sharedDependencies against what this build
  # carries (HALO-422). Transitive already; named here to be importable.
  pub_semver: ^2.2.0
  file_selector: ^1.1.0
  # Drag a log file onto the operation window. Desktop + web only; mobile has
  # no file-drag concept and reaches the same import through the Options menu.
  desktop_drop: ^0.6.0
  shared_preferences: ^2.5.5
  # Direct dependencies because app_storage_prefs_io.dart substitutes a
  # preference store's path provider: the Windows one to keep the preferences
  # file with the rest of the app's files, and the Linux one — on every
  # platform — to give a dev data sandbox its own settings (see
  # app_storage.dart). Otherwise these are implementation details of
  # shared_preferences and path_provider.
  shared_preferences_platform_interface: ^2.4.1
  shared_preferences_windows: ^2.4.1
  shared_preferences_linux: ^2.4.1
  # The file-system abstraction both of those stores expose as their test
  # seam, which is where installAtomicPreferenceWrites hooks in.
  file: ^7.0.1
  path_provider_windows: ^2.3.0
  path_provider_linux: ^2.2.2
  uuid: ^4.5.0
  # Locale-aware month/weekday names for QSO-list day headers; version left
  # to flutter_localizations' own constraint (it already pins intl).
  intl: any
  # Real IANA zones with DST for the clock pane. The bundled tzdata is a
  # snapshot of the PACKAGE release, never of the device, so a zone whose
  # rules change reads an hour off with nothing thrown and nothing logged —
  # see docs/maintenance.md. `data/latest.dart` deliberately, not
  # `data/latest_10y.dart`: the 10y variant carries the same zones but
  # truncates transitions to a window around the package's own build, and
  # that window expires while an install sits on a device.
  timezone: ^0.11.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # DOM/js interop for the Flutter-web map backend (mapbox_web_map_view).
  web: ^1.1.0
  geolocator: ^14.0.3
  # Pinned exact, not caret: 6.2 is a beta line whose upstream has not
  # committed since 2026-02-10, so the next release is not something to float
  # onto. See dependency_overrides below for the Linux implementation.
  flutter_inappwebview: 6.2.0-beta.3
  flutter_secure_storage: ^10.3.1
  flutter_markdown: ^0.7.7+1
  share_plus: ^13.2.0
  http: ^1.6.0
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.8.0
  path_provider: ^2.1.2
  path: ^1.9.0
  crypto: ^3.0.7
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  qr_flutter: ^4.1.0
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  flutter_svg: ^2.3.0
  yaml: ^3.1.2
  shorebird_code_push: ^2.0.7
  # Desktop binary self-update (Sparkle/WinSparkle), see auto_update_service.dart
  # (§3.2). Confirm/pin the exact version on the first `flutter pub get`.
  auto_updater: ^1.0.0
  # Utf16 marshalling for the WinSparkle settings auto_updater exposes no
  # method channel for (winsparkle_config_io.dart). Transitive via auto_updater
  # already, but imported directly, so declared directly.
  ffi: ^2.1.0
  # Must be declared HERE, not only in app_dist/pubspec.yaml, even though only
  # the dist entry point imports it. The dist build runs `flutter pub get` in
  # app/ and then compiles --target=../app_dist/lib/main_dist.dart against
  # APP's package config; nothing ever runs pub get in app_dist/, so a
  # dependency declared only there is inert and the import cannot resolve:
  #
  #   Couldn't resolve the package 'sentry_flutter' in
  #   'package:sentry_flutter/sentry_flutter.dart'
  #
  # That broke every platform in 26.8.1-alpha1+98 (#385 moved it out of here).
  sentry_flutter: ^9.0.0
  flutter_libserialport: ^0.6.0
  # Android-only plugin (dev.bessems.usbserial), but a pure Dart/platform-
  # channel API surface, so it compiles fine on every platform — its methods
  # are only ever called when Platform.isAndroid (serial_transport_io.dart).
  usb_serial: ^0.5.2
  # Minimal hand-rolled Pusher-protocol client (PusherService) sits on top of
  # this rather than a Pusher SDK package: the official pusher_channels_flutter
  # only covers android/ios/web (no macos/windows/linux — the exact platform
  # gap that already bit the SOTA OAuth flow, see oauth_browser_login.dart),
  # and the community pure-Dart alternatives are low-trust single-maintainer
  # packages not worth depending on for something that carries OAuth codes.
  # web_socket_channel is the official Dart-team package and covers all six
  # HaLo targets.
  web_socket_channel: ^3.0.3
  # Only the plain StreamChannel supertype web_socket_channel builds on —
  # PusherService is typed against it directly so tests can inject a fake
  # in-memory channel instead of a real socket.
  stream_channel: ^2.1.4
  universal_ble: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Driving a driver's own poll/resync timers without waiting for them —
  # see cat_flexradio_driver_test.dart. Comes in transitively with
  # flutter_test, but importing it directly means declaring it directly.
  fake_async: ^1.3.0
  # `clock` is the OTHER half of fake_async: inside its zone, `clock.now()`
  # is the fake clock `elapse` advances, which is how a test drives a
  # timer and a staleness check off one clock — see
  # cat_service_test.dart. Same rule as fake_async: transitive
  # through it, imported directly, so declared directly.
  clock: ^1.1.1
  # Faking the url_launcher platform to fence openExternalUrl's scheme
  # allowlist — see link_opener_test.dart. Same rule as fake_async: transitive
  # via url_launcher, but imported directly, so declared directly.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  # Faking the native updater to pin AutoUpdateService's once-per-process
  # setFeedURL contract — see auto_update_service_test.dart. Same rule again:
  # transitive via auto_updater, imported directly, so declared directly.
  auto_updater_platform_interface: ^1.0.0
  # webview_plugin_overrides_test.dart calls the Linux stub's registerWith
  # directly, to pin the contract that it registers nothing. Same rule as
  # fake_async: reachable through the override below, but imported directly,
  # so declared directly. `any` because the override decides the version.
  flutter_inappwebview_linux: any
  # map_back_online_test.dart runs the map's GL script against a fake
  # MapLibre, which needs a JS engine. Same rule as fake_async: transitive
  # via halo_extension_host, but imported directly, so declared directly.
  halo_quickjs:
    path: ../packages/halo_quickjs

# Three of these entries replace a `flutter_inappwebview` platform
# implementation we cannot use as published; each vendored package documents
# its own reason, and dropping any one breaks a build. The rest freeze the
# family at beta.3.
#
# The freeze is load-bearing, not tidiness. Pinning `flutter_inappwebview`
# itself pins only the umbrella — it depends on the interface and the other
# implementations with CARETS, so a `pub upgrade` moves them while the
# vendored macOS copy stays at beta.3 forever. That reproduces exactly the
# failure quirks.md records for the rejected "hold macos at 1.1.2" option: a
# green analyze and a green Dart suite, then `flutter build macos` dying in
# the kernel snapshot on an interface member the vendored copy still uses.
# Re-vendor and move these together or not at all.
dependency_overrides:
  flutter_inappwebview_platform_interface: 1.4.0-beta.3
  # The interface pulls this one with a CARET (`^1.3.0`), so it is the family
  # member a `pub upgrade` is still free to move while every other pin holds.
  # It carries the annotations the rest of the family is written against, so
  # it moves when they do or not at all.
  flutter_inappwebview_internal_annotations: 1.3.0
  flutter_inappwebview_android: 1.2.0-beta.3
  flutter_inappwebview_ios: 1.2.0-beta.3
  flutter_inappwebview_web: 1.2.0-beta.3
  # See packages/flutter_inappwebview_windows_patched/PATCH.md: a use-after-free
  # in the plugin's own C++ destructor, racing the engine's raster thread
  # during window close (HALO-290/HALO-NEXT-3).
  flutter_inappwebview_windows:
    path: ../packages/flutter_inappwebview_windows_patched
  # Upstream's SPM manifest declares a lower macOS minimum than its own code
  # requires, so the package does not compile under Swift Package Manager —
  # which 6.2 is the first version to use here. One line differs; see the
  # package's PATCH.md.
  flutter_inappwebview_macos:
    path: ../packages/flutter_inappwebview_macos_patched
  # The endorsed Linux implementation needs WPE WebKit, whose absence makes
  # its CMakeLists a FATAL_ERROR — and no Ubuntu after 22.04 ships WPE,
  # including the image both AppImage workflows build on. The stub keeps
  # Linux resolving to no web view at all, exactly as it did before 6.2
  # endorsed one. Drop it when Linux has a shippable engine (HALO-220); this
  # slot is where that implementation would go.
  flutter_inappwebview_linux:
    path: ../packages/flutter_inappwebview_linux_stub
  # Upstream is unmaintained (last release 0.5.2) and its android/build.gradle
  # still applies AGP via the pre-`plugins{}` `apply plugin:` syntax, which
  # fails to load `com.android.library` under AGP 9. See the package's
  # PATCH.md.
  usb_serial:
    path: ../packages/usb_serial_patched
  # Upstream's Windows UI-thread hop takes no account of its own teardown, and
  # races on the `hwnd_` that the UI thread writes and every caller reads. The
  # vendored copy closes both, plus Release PDBs for this plugin's own frames.
  # The teardown gate is ported from upstream and will arrive on its own; the
  # atomic `hwnd_` upstream still does not have, so a re-vendor that takes
  # their newer `ui_thread_handler.hpp` wholesale drops it while looking like
  # an upgrade. See the package's PATCH.md.
  universal_ble:
    path: ../packages/universal_ble_patched

flutter:
  # The built-in MaterialIcons font ships ONLY as a safety net for glyphs
  # Flutter renders internally with no override point (the Android
  # text-selection toolbar's overflow buttons, e.g.) — those cannot be
  # enumerated, so dropping the font trades ~1.6 MB for tofu boxes that
  # surface one framework internal at a time. Our own code never uses
  # Icons.*: the app's icon language is MDI (icon_names_test.dart enforces
  # it), and framework defaults we CAN override are re-pointed at MDI in
  # buildHaLoTheme's actionIconTheme and per-site dropdown/expansion icons.
  uses-material-design: true
  assets:
    - assets/extensions/
    # MapLibre GL JS itself, vendored so the Map tab draws with no network at
    # all -- only the tiles and the style need one. See
    # lib/views/map/map_gl_script.dart. LICENSE.txt rides along because the
    # library is BSD-3-Clause and this ships a copy of it.
    - assets/maplibre/
    # The `.h2kext` bundles the app pre-loads under the catalog experiment,
    # plus the index naming them (HALO-581). Tracked, unlike
    # `assets/extensions/`, which the extension build writes.
    - assets/preloaded-extensions/
    # Meter calibration tables, one file per radio — see
    # lib/services/cat/drivers/info/README.md. Beside the drivers that read
    # them rather than under assets/, because they are edited as part of
    # working on a driver. Asset directories are NOT recursive, so a new
    # MANUFACTURER folder needs a line of its own here; a new radio in an
    # existing folder needs nothing.
    - lib/services/cat/drivers/info/yaesu/
    - lib/services/cat/drivers/info/icom/
    - lib/services/cat/drivers/info/kenwood/
    - assets/images/
    - assets/images/releases/
    - assets/release-notes.yaml
    - assets/tester-notes.yaml
    - experiments.yaml
    # Shorebird reads this at runtime to know which app/patch feed to check
    # (docs/releases.md §4). Inert in Dev/plain builds.
    - shorebird.yaml
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed.ttf
    - family: MaterialDesignIcons
      fonts:
        - asset: assets/fonts/MaterialDesignIcons.ttf
    - family: FontAwesome6Solid
      fonts:
        - asset: assets/fonts/FontAwesome6Solid.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
