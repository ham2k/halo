name: polo_next
description: "Ham2K Portable Logger Next — spike: JS extension runtime bridge."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  polo_extension_host:
    path: ../packages/polo_extension_host
  polo_core:
    path: ../packages/polo_core
  polo_widgets:
    path: ../packages/polo_widgets
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/extensions/
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
    - family: MaterialDesignIcons
      fonts:
        - asset: assets/fonts/MaterialDesignIcons.ttf
