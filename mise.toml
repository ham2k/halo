[tools]
flutter = {
  version = "3.44.9",
  platforms = {
    linux-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_{{ version }}-stable.tar.xz" },
    macos-arm64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_{{ version }}-stable.zip" },
    macos-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_{{ version }}-stable.zip" },
    windows-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_{{ version }}-stable.zip" }
  },
  version_expr = 'fromJSON(body).releases | filter({ #.channel == "stable" }) | map({ replace(#.version, "-stable", "") }) | sortVersions()', version_list_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
}

[tasks]
setup = {
  run = "./scripts/setup.sh",
  description = "First-run setup, idempotent: git hooks, secrets template, extension bundles, host JS engine, patched packages, pub get"
}
deploy-web = {
  run = "./scripts/deploy-web.sh",
  description = "Build extensions and web app, then deploy to Cloudflare Pages"
}
ops = {
  run = "cd app_dist/halo_dist_tools && dart run bin/halo_ops.dart",
  description = "halo-ops CLI: `mise run ops -- status` / `mise run ops -- release [--dry-run]`"
}
ext = {
  run = "cd packages/halo_cli && dart run bin/halo_ext.dart",
  description = "halo-ext CLI: run extension hooks outside the app — `mise run ext -- lookup KI2D`"
}
run-ios = { run = "open -a Simulator && cd app && sha=$(git rev-parse --short HEAD) && flutter run -d iphone --dart-define=HALO_GIT_SHA=\"$sha\"", depends = ["prepare-record"], description = "Boot iOS Simulator and run the app" }
strings = {
  run = "cd packages/halo_i18n && dart run tool/generate_hidden_locales.dart && dart run slang",
  description = "Regenerate the app's strings after editing packages/halo_i18n/lib/i18n/en.i18n.json"
}
crowdin-push = {
  run = "crowdin upload sources",
  description = "Upload the English strings to Crowdin (needs CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN)"
}
crowdin-pull = {
  run = "crowdin download --skip-untranslated-strings -l ca -l cs -l de -l es-ES -l fr -l it -l ja -l ko -l nb -l nl -l pt-BR -l pt-PT -l ro -l sk -l tr -l zh-CN && mise run strings",
  description = "Download the bundled languages from Crowdin and regenerate the strings"
}
bundle = {
  run = "cd extensions && npm run build",
  description = "Build the JS/TS extensions"
}
test = {
  run = "./scripts/test.sh",
  description = "Full gate: typecheck + test extensions, rebuild bundles, analyze + test every Dart package. Subsets: `mise run test -- --list | --changed | <group>...`"
}
android = {
  depends = ["prepare-record"],
  run = "cd app && sha=$(git rev-parse --short HEAD) && flutter run -d android --dart-define=HALO_GIT_SHA=\"$sha\"",
  description = "Run the app on an Android device or emulator"
}
mac = {
  depends = ["prepare-record"],
  run = "(cd extensions && npm run build && cd ../app && sha=$(git rev-parse --short HEAD) && flutter run -d macos --dart-define=HALO_GIT_SHA=\"$sha\")",
  description = "Build & run macOS app"
}
web = {
  depends = ["prepare-record"],
  run = "(cd extensions && npm run build && cd ../app && sha=$(git rev-parse --short HEAD) && flutter run -d web-server --web-port 8765 --dart-define=HALO_GIT_SHA=\"$sha\")",
  description = "Run the app as a web server on :8765"
}
windows = {
  depends = ["prepare-record"],
  run = "(cd extensions && npm run build && cd ../app && sha=$(git rev-parse --short HEAD) && flutter run -d windows --dart-define=HALO_GIT_SHA=\"$sha\")",
  description = "Run the app on Windows"
}
linux = {
  depends = ["prepare-record"],
  run = "(cd extensions && npm run build && cd ../app && sha=$(git rev-parse --short HEAD) && flutter run -d linux --dart-define=HALO_GIT_SHA=\"$sha\")",
  description = "Run the app on Linux"
}
mac-files = {
  run = "open ~/Library/Containers/com.ham2k.logger/Data/Documents",
  description = "Open the macOS app's sandboxed Documents folder (sqlite db, etc.)"
}
