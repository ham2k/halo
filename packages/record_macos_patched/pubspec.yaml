name: record_macos
description: Pinned macos recorder backend with HaLo I/Q source validation.
version: 2.1.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ^2.1.0

flutter:
  plugin:
    implements: record
    platforms:
      macos:
        pluginClass: RecordMacOsPlugin
