name: record_android
description: Pinned android recorder backend with HaLo I/Q source validation.
version: 2.2.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ^2.1.0

flutter:
  plugin:
    implements: record
    platforms:
      android:
        package: com.ham2k.halo.record
        pluginClass: HaloRecordPlugin
