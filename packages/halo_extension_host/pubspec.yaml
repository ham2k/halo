name: halo_extension_host
description: "JS-engine extension host for HaLo Next: loads TypeScript extension bundles and bridges hook calls between Dart and the extension runtime."
publish_to: 'none'
version: 0.0.1
homepage: https://ham2k.com

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  halo_quickjs:
    path: ../halo_quickjs
  http: ^1.2.0
  meta: ^1.16.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only, and deliberately not a real dependency: this package knows how to
  # PUSH clock travel into the sandbox (setClockTravel) without knowing where the
  # numbers come from, which is what keeps the host independent of the app's
  # clock. sandbox_clock_test drives the real AppClock so it proves the two
  # actually agree (docs/design/time.md).
  halo_core:
    path: ../halo_core

flutter:
