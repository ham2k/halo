name: halo_extension_host
description: "JS-engine extension host for HaLo Next: loads TypeScript extension bundles and bridges hook calls between Dart and the extension runtime."
publish_to: 'none'
version: 0.0.1
homepage: https://ham2k.com

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  halo_quickjs:
    path: ../halo_quickjs
  http: ^1.2.0
  meta: ^1.16.0
  web: ^1.1.1
  # host.webSocket — the same package the app's Pusher client stands on, and
  # for the same reason: one API across every target, browser included.
  web_socket_channel: ^3.0.3
  # For the SSO proxy an extension's relayed OAuth requests go through
  # (ham2k_sso_proxy.dart), and for `realNowUtc` — real time on purpose, for
  # protocol timing. Never the travelled clock: this package PUSHES clock
  # travel into the sandbox (setClockTravel) without reading it, which is what
  # keeps the host independent of the app's clock; sandbox_clock_test drives
  # the real AppClock to prove the two agree (docs/design/time.md).
  halo_core:
    path: ../halo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
