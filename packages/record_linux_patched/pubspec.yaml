name: record_linux
description: Pinned linux recorder backend with HaLo I/Q source validation.
version: 2.1.3
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ^2.1.0
  ffi: ^2.1.4

flutter:
  plugin:
    implements: record
    platforms:
      linux:
        pluginClass: RecordLinuxPlugin
        dartPluginClass: RecordLinux
