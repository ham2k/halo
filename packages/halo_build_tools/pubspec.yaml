name: halo_build_tools
description: "HaLo Next build tooling: version and build-id computation for CI. Pure Dart — no Flutter dependency."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  # Pure Dart (collection/source_span/string_scanner), so the no-Flutter
  # promise above still holds. tester_notes_file.dart parses what it rewrites:
  # the release cut tags and pushes that file, and the app degrades a yaml
  # failure to no notes at all.
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
