name: halo_core
description: "HaLo Next core: data model, storage, and ham radio domain utilities. Pure Dart — no Flutter dependency."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  # The app clock's one real read goes through `clock.now()` — DateTime.now()
  # in production, the fake clock inside `fakeAsync` (docs/design/time.md §7).
  clock: ^1.1.1
  drift: ^2.28.0
  meta: ^1.15.0
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  # Raw file inspection in migration_test.dart, where a half-migrated
  # database must be examined WITHOUT drift running the migration again.
  sqlite3: ^2.4.0
  lints: ^6.0.0
  test: ^1.25.6
  # Driving the app clock on a fake one — see app_clock_test.dart.
  fake_async: ^1.3.0
